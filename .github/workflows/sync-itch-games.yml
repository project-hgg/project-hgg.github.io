name: Sync Itch Horror Games

on:
  schedule:
    # Run every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

concurrency:
  group: sync-itch-catalog
  cancel-in-progress: false

jobs:
  sync-games:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push updated search-index.json back to main

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Itch Horror Ingestion Engine
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DATABASE_ID: ${{ secrets.CLOUDFLARE_DATABASE_ID }}
        run: npx tsx scripts/sync-new-itch-games.ts

      - name: Commit & Push Updated Catalog Dump & Manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain docs/public/catalog-dump.json.gz docs/public/catalog-manifest.json docs/public/data-version.json)" ]; then
            git add docs/public/catalog-dump.json.gz docs/public/catalog-manifest.json docs/public/data-version.json
            git commit -m "chore(catalog): auto-sync new itch horror games [skip ci]"
            COMMIT_SHA=$(git rev-parse --short HEAD)
            FULL_SHA=$(git rev-parse HEAD)
            COMMIT_DATE=$(git log -1 --format=%cI)
            node -e "
              const fs = require('fs');
              const p = 'docs/public/data-version.json';
              const d = fs.existsSync(p) ? JSON.parse(fs.readFileSync(p, 'utf-8')) : {};
              d.commitSha = '$COMMIT_SHA';
              d.fullSha = '$FULL_SHA';
              d.commitMessage = 'chore(catalog): auto-sync new itch horror games';
              d.timestamp = '$COMMIT_DATE';
              d.totalGames = JSON.parse(fs.readFileSync('docs/public/catalog-manifest.json')).totalGames;
              fs.writeFileSync(p, JSON.stringify(d, null, 2));
            "
            git add docs/public/data-version.json
            git commit --amend --no-edit
            git push
            echo "🚀 Pushed updated catalog dump, manifest, and data-version.json ($COMMIT_SHA)!"
          else
            echo "✨ No catalog changes to commit."
          fi

