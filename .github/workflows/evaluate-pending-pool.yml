name: Evaluate Pending Horror Games Incubation Pool

on:
  schedule:
    # Run every Sunday at 03:00 UTC (before weekly catalog dump at 05:00 UTC)
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Number of pending games to evaluate in this rolling window'
        required: false
        default: '150'
        type: string
      min_votes:
        description: 'Minimum ratings/votes required to graduate to Main Catalog'
        required: false
        default: '2'
        type: string
      dry_run:
        description: 'Dry run mode (do not commit changes)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: evaluate-pending-pool
  cancel-in-progress: false

jobs:
  evaluate-pool:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      rebuild_needed: ${{ steps.eval-step.outputs.rebuild_needed }}
      graduated_count: ${{ steps.eval-step.outputs.graduated_count }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Incubation Pool Evaluator
        id: eval-step
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DATABASE_ID: ${{ secrets.CLOUDFLARE_DATABASE_ID }}
        run: |
          ARGS="--limit=${{ inputs.limit || 150 }} --min-votes=${{ inputs.min_votes || 2 }}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          echo "Executing: npx tsx scripts/evaluate-pending-pool.ts $ARGS"
          npx tsx scripts/evaluate-pending-pool.ts $ARGS

      - name: Commit & Push Updated Incubation Pool and Manifests
        if: inputs.dry_run != true && inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain docs/public/pending-catalog.json.gz docs/public/pending-manifest.json docs/public/pending-games.json docs/public/todo.md todo.md)" ]; then
            git add docs/public/pending-catalog.json.gz docs/public/pending-manifest.json docs/public/pending-games.json docs/public/todo.md todo.md
            git commit -m "chore(incubation): rolling evaluation of pending horror games [skip ci]"
            for i in 1 2 3; do
              git fetch origin main
              git pull --rebase -X theirs origin main || true
              git push origin main && break || sleep 3
            done
            echo "🚀 Pushed updated pending incubation pool and manifests!"
          else
            echo "✨ No incubation pool changes to commit."
          fi

  # If games graduated from incubation to the main catalog, trigger a full catalog rebuild
  trigger-catalog-rebuild:
    needs: evaluate-pool
    if: needs.evaluate-pool.outputs.rebuild_needed == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/generate-catalog-dump.yml
    secrets: inherit
