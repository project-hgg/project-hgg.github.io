name: Community Metrics & Engagement Sync

on:
  schedule:
    # Runs at 03:00 UTC on alternate days (every 2 days)
    - cron: '0 3 */2 * *'
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Number of titles to enrich (min 5, max 200)'
        required: false
        default: '50'
      delay_ms:
        description: 'Pacing delay between upstream requests in ms (min 12000, max 60000)'
        required: false
        default: '13000'

concurrency:
  group: community-metrics-sync
  cancel-in-progress: false

jobs:
  sync-metrics:
    name: Sync Community Playtime & Engagement Stats
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Stats Ingestion Pipeline
        env:
          SYNC_API_BASE: ${{ secrets.SYNC_API_BASE }}
          SYNC_API_KEY: ${{ secrets.SYNC_API_KEY }}
          SYNC_AUTH_HEADER: ${{ secrets.SYNC_AUTH_HEADER }}
          SYNC_TABLE_NAME: ${{ secrets.SYNC_TABLE_NAME }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DATABASE_ID: ${{ secrets.CLOUDFLARE_DATABASE_ID }}
        run: |
          BATCH=${{ github.event.inputs.batch_size || '50' }}
          DELAY=${{ github.event.inputs.delay_ms || '13000' }}
          echo "Starting community playtime stats sync (batch: $BATCH, delay: ${DELAY}ms)..."
          npx tsx scripts/data-sync.ts --batch=$BATCH --delay=$DELAY
