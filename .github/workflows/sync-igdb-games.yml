name: Sync IGDB Horror Games

on:
  schedule:
    # Run every Sunday at 04:00 UTC (catalog dump runs at 05:00 UTC after this)
    - cron: '0 4 * * 0'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

permissions:
  contents: write # Needed for committing data and invoking reusable export workflow

concurrency:
  group: sync-igdb-catalog
  cancel-in-progress: false

jobs:
  sync-games:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push updated search-index.json back to main

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run IGDB Partner Dumps Horror Ingestion Engine
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DATABASE_ID: ${{ secrets.CLOUDFLARE_DATABASE_ID }}
        run: npx tsx scripts/sync-new-igdb-dumps.ts

      - name: Commit & Push Updated Catalog Dump & Manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain docs/public/catalog-dump.json.gz docs/public/catalog-manifest.json docs/public/data-version.json docs/public/pending-games.json docs/public/todo.md todo.md)" ]; then
            git add docs/public/catalog-dump.json.gz docs/public/catalog-manifest.json docs/public/data-version.json docs/public/pending-games.json docs/public/todo.md todo.md
            git commit -m "chore(catalog): auto-sync weekly igdb horror games [skip ci]"
            COMMIT_SHA=$(git rev-parse --short HEAD)
            FULL_SHA=$(git rev-parse HEAD)
            COMMIT_DATE=$(git log -1 --format=%cI)
            node -e "
              const fs = require('fs');
              const p = 'docs/public/data-version.json';
              const d = fs.existsSync(p) ? JSON.parse(fs.readFileSync(p, 'utf-8')) : {};
              d.commitSha = '$COMMIT_SHA';
              d.fullSha = '$FULL_SHA';
              d.commitMessage = 'chore(catalog): auto-sync weekly igdb horror games';
              d.timestamp = '$COMMIT_DATE';
              d.totalGames = JSON.parse(fs.readFileSync('docs/public/catalog-manifest.json')).totalGames;
              fs.writeFileSync(p, JSON.stringify(d, null, 2));
            "
            git add docs/public/data-version.json
            git commit --amend --no-edit
            for i in 1 2 3; do
              git fetch origin main
              git pull --rebase -X theirs origin main || true
              git push origin main && break || sleep 3
            done
            echo "🚀 Pushed updated catalog dump, manifest, and data-version.json ($COMMIT_SHA)!"
          else
            echo "✨ No catalog changes to commit."
          fi

  # After IGDB sync finishes, trigger a full catalog rebuild + HF upload
  trigger-catalog-rebuild:
    needs: sync-games
    permissions:
      contents: write
    uses: ./.github/workflows/generate-catalog-dump.yml
    secrets: inherit
